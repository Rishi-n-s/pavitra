<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Pavitra — The Main Character Issue</title>
<meta name="theme-color" content="#F7EDE2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bh:64px;--cream:#F7EDE2;--pink:#F2BFC8;--yellow:#F4D96B;--lilac:#C9B9E8;--ink:#29242A;--coral:#E98983;--bg:#e9ddd0}
@media(prefers-color-scheme:dark){:root{--bg:#2b2528}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#book{position:relative;width:1120px;height:792px;flex:none;perspective:2600px;transition:transform .9s cubic-bezier(.5,.1,.2,1)}
#book.fl{animation:fl .55s ease}#book.fr{animation:fr .55s ease}
@keyframes fl{from{transform:var(--s) rotateY(-14deg);opacity:.2}to{transform:var(--s)}}
@keyframes fr{from{transform:var(--s) rotateY(14deg);opacity:.2}to{transform:var(--s)}}
@media(prefers-reduced-motion:reduce){#book.fl,#book.fr{animation:none}}
.pg{width:560px;height:792px;position:relative;overflow:hidden;flex:none;display:block;
background:radial-gradient(circle at 20% 15%,#fff7ee 0,transparent 45%),radial-gradient(circle at 80% 85%,#efdcc9 0,transparent 50%),var(--cream);
box-shadow:0 12px 40px #0004;font-size:14px}
.pg.on{display:block}.pg.pink{background:var(--pink)}
.pg.L{box-shadow:inset -22px 0 24px -18px #0003,0 12px 40px #0004}.pg.R{box-shadow:inset 22px 0 24px -18px #0003,0 12px 40px #0004}
.pg>*{position:absolute}
h1,h2{font-family:'Playfair Display',serif;margin:0;line-height:1}
.hw{font-family:Caveat,cursive;font-weight:700;line-height:1.1}
.pol{background:#fff;padding:8px 8px 28px;box-shadow:0 4px 12px #0003;transform:rotate(var(--r,0deg));transition:translate .25s,scale .25s}
.pol:hover{translate:0 -6px;scale:1.04;z-index:9}
.pol img{display:block;width:100%;height:var(--h);object-fit:cover}
.pol i{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:700 17px Caveat,cursive;font-style:normal}
.tape{width:80px;height:24px;background:#f4d96bcc;transform:rotate(var(--r,-4deg));box-shadow:0 1px 3px #0002}
.tape.p{background:#f2bfc8cc}.tape.l{background:#c9b9e8cc}
.stk{padding:8px 12px;font:700 20px Caveat,cursive;background:var(--yellow);transform:rotate(var(--r,4deg));box-shadow:0 2px 5px #0002;transition:scale .3s}
.stk:hover{scale:1.15}
.stk.p{background:var(--pink)}.stk.l{background:var(--lilac)}
.pn{bottom:12px;font-size:11px;letter-spacing:.15em;opacity:.6}
.list{font:700 21px/1.45 Caveat,cursive}.list li{list-style:none}
.list.chk li::before{content:'♡ ';color:var(--coral)}
label.cb{display:flex;align-items:center;font:700 22px Caveat,cursive;cursor:pointer;margin:7px 0}
label.cb input{appearance:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:4px;background:#fff8;display:grid;place-items:center;cursor:pointer;flex:none}
label.cb input:checked{background:var(--yellow)}label.cb input:checked::after{content:'✓';font:700 18px sans-serif}
label.cb input:checked+span{text-decoration:line-through;opacity:.6}
.btn{font:700 14px 'DM Sans',sans-serif;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);padding:10px 16px;border-radius:99px;cursor:pointer}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.toc a{display:block;color:var(--ink);text-decoration:none;font:700 21px/1.5 Caveat,cursive}.toc a:hover{background:#fff8}
#mw{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:12px;right:calc(12px + env(safe-area-inset-right));z-index:30;display:flex;flex-direction:column;align-items:flex-end}
#mb{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--cream);font-size:20px;cursor:pointer;box-shadow:0 3px 10px #0004;opacity:.88;transition:transform .3s,opacity .2s;padding:0}
#mb:hover{opacity:1;transform:rotate(90deg) scale(1.08)}
#bar{margin-top:8px;padding:10px;background:var(--cream);border-radius:20px;box-shadow:0 8px 28px #0004;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;width:max-content;max-width:calc(100vw - 24px);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.94);transform-origin:top right;transition:opacity .25s,transform .25s,visibility .25s}
#mw.open #bar{opacity:1;visibility:visible;transform:none}
#mw.kb #bar{opacity:1;visibility:visible;transform:none}
@media(hover:hover){#mw:hover #bar{opacity:1;visibility:visible;transform:none}}
#ind{color:var(--ink)!important}

#bar button{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--ink);color:var(--cream);font-size:clamp(14px,4vw,18px);cursor:pointer;padding:0}#bar #pp{background:var(--yellow);color:var(--ink)}#bar button:hover:not(:disabled){transform:translateY(-2px)}#cf{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50}@media(max-width:480px){#fs{display:none}}@media(max-height:480px){:root{--bh:50px}}
#bar button:disabled{opacity:.3;cursor:default}#ind{min-width:clamp(50px,14vw,70px);text-align:center;font-size:clamp(11px,3vw,13px);white-space:nowrap;color:var(--ink)}
@media(prefers-color-scheme:dark){#ind{color:var(--cream)}}
#ov{position:fixed;top:0;right:0;bottom:0;left:0;background:#000a;display:none;z-index:20;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}#ov div{background:var(--cream);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
#ov button{border:2px dashed var(--ink);background:#fff8;padding:14px 8px;border-radius:8px;font:700 19px Caveat,cursive;cursor:pointer;color:var(--ink)}
[contenteditable=true]{outline:2px dashed var(--coral)}

.popbtn{background:#ec5f8f;color:#fff;font:700 21px Caveat,cursive;padding:10px 22px;box-shadow:0 4px 0 var(--ink);animation:wob 1.8s ease-in-out infinite}
.popbtn:hover{animation-duration:.45s}.popbtn:active{animation:none;transform:scale(.9);box-shadow:0 1px 0 var(--ink)}
.popbtn::before,.popbtn::after{content:'✨';position:absolute;font-size:18px;animation:tw 1.2s ease-in-out infinite}
.popbtn::before{left:-12px;top:-14px}.popbtn::after{right:-10px;bottom:-14px;animation-delay:.6s}
@keyframes wob{0%,100%{transform:rotate(-4deg) scale(1)}25%{transform:rotate(4deg) scale(1.08)}50%{transform:rotate(-3deg) scale(1)}75%{transform:rotate(3deg) scale(1.06)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(30deg)}}
.sp{position:absolute;left:50%;top:50%;font-size:20px;pointer-events:none;animation:spf .9s ease-out forwards}
@keyframes spf{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot));opacity:0}}
@media(prefers-reduced-motion:reduce){.popbtn,.popbtn::before,.popbtn::after{animation:none}}

.pol{animation:sway 7s ease-in-out infinite}.stk{animation:bob 3.6s ease-in-out infinite}.dd{animation:tw2 2.6s ease-in-out infinite}
.btn[data-go]{animation:pulse 1.8s infinite}.hetvi{animation:het 2.8s ease-in-out infinite;transform-origin:left bottom}
.ltr{display:inline-block;animation:hop 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(var(--r,0deg))}50%{transform:rotate(calc(var(--r,0deg) + 1.8deg)) translateY(-4px)}}
@keyframes bob{0%,100%{transform:rotate(var(--r,4deg)) translateY(0)}50%{transform:rotate(calc(var(--r,4deg) + 3deg)) translateY(-7px)}}
@keyframes tw2{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.28) rotate(14deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #f4d96bdd}70%{box-shadow:0 0 0 16px #f4d96b00}100%{box-shadow:0 0 0 0 #f4d96b00}}
@keyframes het{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(-2deg) scale(1.06)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-3deg)}}
#amb{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden}
.fh{position:absolute;bottom:-40px;opacity:0;animation:fup linear infinite}
@keyframes fup{0%{transform:translateY(0) rotate(0);opacity:0}10%,90%{opacity:.7}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.tr{position:fixed;pointer-events:none;font-size:14px;z-index:40;animation:trl .8s ease-out forwards}
@keyframes trl{to{transform:translateY(24px) scale(.2) rotate(90deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.pol,.stk,.dd,.btn[data-go],.hetvi,.ltr{animation:none}#amb,.tr{display:none}}
@media print{.pol,.stk,.dd,.hetvi,.ltr,.btn{animation:none!important}#amb{display:none}}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;width:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#stage{left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom)}
body.single #stage{top:52px}
#bar>*{margin:4px}label.cb span{margin-left:10px}
.leaf{will-change:auto}.leaf.turn{will-change:transform}.leaf.hid{display:none}
.pg{-webkit-user-select:none;user-select:none}[contenteditable=true] .pg{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}
@supports not (translate:0 0){.pol:hover{box-shadow:0 12px 22px #0004}.stk:hover{filter:brightness(1.06)}}
@media(max-width:380px){#mb{width:40px;height:40px}}
@media print{body{position:static!important;overflow:visible!important}.pg{page-break-after:always}.leaf:last-child .face.bk .pg{page-break-after:auto}}

.leaf{position:absolute;left:560px;top:0;width:560px;height:792px;transform-style:preserve-3d;transform-origin:left center;transition:transform 1s cubic-bezier(.45,.05,.25,1)}
.leaf.f{transform:rotateY(-180deg)}
.face{position:absolute;top:0;right:0;bottom:0;left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.bk{transform:rotateY(180deg)}
.face::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(to right,#0000003a,#0000 9%,#0000 92%,#0000000f)}
.face.bk::after{background:linear-gradient(to left,#0000003a,#0000 9%,#0000 92%,#0000000f)}
.leaf.turn .face::after{animation:sh 1s ease}
@keyframes sh{50%{background:linear-gradient(to right,#0007,#0000 70%)}}
@media(prefers-reduced-motion:reduce){.leaf,#book{transition-duration:.01s}.leaf.turn .face::after{animation:none}}
@media print{#book{width:auto!important;perspective:none!important}.leaf{position:static!important;transform:none!important;width:auto;height:auto}.face{position:static!important;transform:none!important}.face::after{display:none}.pg{break-after:page}}
@media print{
@page{size:A4;margin:0}html,body{height:auto;overflow:visible;background:none}
#bar,#ov,#stage{position:static!important}#mw,#bar,#ov,#cf{display:none!important}
#book{display:block!important;transform:none!important;height:auto;animation:none!important}
.pg{display:block!important;zoom:1.4;box-shadow:none!important;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.leaf:last-child .face.bk .pg{break-after:auto}.noprint{display:none}}
.lite .pol,.lite .stk,.lite .dd,.lite .ltr,.lite .hetvi,.lite .btn[data-go],.lite .popbtn::before,.lite .popbtn::after,.lite .leaf.turn .face::after{animation:none!important}
.lite #amb{display:none}.lite .pg{box-shadow:none}
@media print{.leaf.hid{display:block!important}}
.ttl{display:flex;flex-wrap:nowrap;align-items:flex-start;white-space:nowrap;width:max-content;height:1em;line-height:1}.ttl .ltr{display:block}
